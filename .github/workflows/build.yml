
name: Linux Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            ca-certificates \
            pkg-config \
            python3 \
            python3-venv \
            python3-pip \
            xz-utils \
            zlib1g-dev \
            libpcre2-dev \
            libffi-dev \
            libglib2.0-dev \
            libmount-dev \
            libpixman-1-dev \
            ninja-build \
            meson

      - name: Download QEMU
        run: |
          mkdir -p build
          curl -L \
            https://download.qemu.org/qemu-10.2.2.tar.xz \
            -o build/qemu.tar.xz

      - name: Extract QEMU
        run: |
          cd build
          tar -xf qemu.tar.xz \
            --exclude='qemu-10.2.2/roms/u-boot*' \
            --exclude='qemu-10.2.2/roms/skiboot' \
            --exclude='qemu-10.2.2/roms/edk2' \
            --exclude='qemu-10.2.2/tests'

      - name: Install W580 machine sources
        run: |
          cp qemu/hw/arm/w580.c build/qemu-10.2.2/hw/arm/
          cp qemu/hw/arm/*.inc build/qemu-10.2.2/hw/arm/

          grep -q "w580.c" build/qemu-10.2.2/hw/arm/meson.build || \
            echo "system_ss.add(when: 'CONFIG_W580', if_true: files('w580.c'))" \
            >> build/qemu-10.2.2/hw/arm/meson.build

      - name: Configure QEMU
        run: |
          cd build/qemu-10.2.2

          ../configure \
            --target-list=arm-softmmu \
            --enable-system \
            --disable-user \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-vnc \
            --disable-werror \
            --enable-tools \
            --prefix=/usr/local

      - name: Build QEMU
        run: |
          cd build/qemu-10.2.2
          ninja -C build -v

      - name: Check executable
        run: |
          find build/qemu-10.2.2 -name "qemu-system-arm" -print
          test -f build/qemu-10.2.2/build/qemu-system-arm
          build/qemu-10.2.2/build/qemu-system-arm --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: senew-emu-linux-x64
          path: build/qemu-10.2.2/build/qemu-system-arm
