
name: Linux Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            ca-certificates \
            pkg-config \
            python3 \
            python3-venv \
            python3-pip \
            xz-utils \
            zlib1g-dev \
            libpcre2-dev \
            libffi-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            meson

      - name: Download QEMU
        run: |
          mkdir -p build
          curl -fL --retry 3 \
            https://download.qemu.org/qemu-10.2.2.tar.xz \
            -o build/qemu-10.2.2.tar.xz

      - name: Build W580 QEMU
        run: |
          JOBS=2 NICE=0 QEMU_TAR=build/qemu-10.2.2.tar.xz \
            scripts/build.sh

      - name: Check executable
        run: |
          ./build/qemu-system-arm --version
          ./build/qemu-system-arm -M help | grep -i w580

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: senew-emu-linux-x64
          path: build/qemu-system-arm
