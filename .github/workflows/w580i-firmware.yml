
name: W580i Firmware Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "senew-w580-main/**"
      - ".github/workflows/w580i-firmware.yml"

jobs:
  build-w580i:
    name: Build W580i Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            binutils \
            python3 \
            python3-pip \
            git

      - name: Show build environment
        run: |
          gcc --version
          make --version
          python3 --version

      - name: Run W580i Makefile
        working-directory: senew-w580-main
        run: |
          make -j3 W580i
