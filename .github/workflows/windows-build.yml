
name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-gnutls

      - name: Diagnose toolchain
        run: |
          echo "=== Environment ==="
          echo "MSYSTEM=$MSYSTEM"
          echo "$PATH"

          echo "=== Compiler ==="
          which gcc
          which g++
          which ld

          gcc --version
          g++ --version

          echo "=== GLib ==="
          pkg-config --libs glib-2.0
          pkg-config --libs gio-2.0

      - name: Download QEMU
        run: |
          mkdir -p build
          curl -fL --retry 3 \
            https://download.qemu.org/qemu-10.2.2.tar.xz \
            -o build/qemu.tar.xz

      - name: Extract QEMU
        run: |
          cd build
          tar -xf qemu.tar.xz \
            --exclude='qemu-10.2.2/roms/u-boot*' \
            --exclude='qemu-10.2.2/roms/skiboot' \
            --exclude='qemu-10.2.2/roms/edk2'

      - name: Install W580 machine sources
        run: |
          cp qemu/hw/arm/w580.c build/qemu-10.2.2/hw/arm/
          cp qemu/hw/arm/*.inc build/qemu-10.2.2/hw/arm/

          grep -q "w580.c" build/qemu-10.2.2/hw/arm/meson.build || \
            echo "system_ss.add(when: 'CONFIG_W580', if_true: files('w580.c'))" \
            >> build/qemu-10.2.2/hw/arm/meson.build

      - name: Configure QEMU
        run: |
          export PATH="/ucrt64/bin:/usr/bin"

          export CC=gcc
          export CXX=g++
          export AR=ar
          export NM=nm
          export STRIP=strip
          export PKG_CONFIG=pkg-config
          export PKG_CONFIG_LIBDIR="/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig"
          unset PKG_CONFIG_PATH

          cd build/qemu-10.2.2
          mkdir -p build
          cd build

          ../configure \
            --target-list=arm-softmmu \
            --enable-system \
            --disable-user \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-vnc \
            --disable-werror \
            --enable-tools \
            --prefix=/usr/local

      - name: Build QEMU
        run: |
          export PATH="/ucrt64/bin:/usr/bin"
          export CC=gcc
          export CXX=g++
          export PKG_CONFIG=pkg-config
          export PKG_CONFIG_LIBDIR="/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig"
          unset PKG_CONFIG_PATH

          cd build/qemu-10.2.2
          ninja -C build -v

      - name: Check executable
        run: |
          test -f build/qemu-10.2.2/build/qemu-system-arm.exe
          build/qemu-10.2.2/build/qemu-system-arm.exe --version
          build/qemu-10.2.2/build/qemu-system-arm.exe -M help | grep -i w580

      - name: Package Windows build
        run: |
          mkdir -p package
          cp build/qemu-10.2.2/build/qemu-system-arm.exe package/
          cp /ucrt64/bin/*.dll package/ || true

          cd package
          7z a ../senew-emu-windows-x64.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: senew-emu-windows-x64
          path: senew-emu-windows-x64.zip
